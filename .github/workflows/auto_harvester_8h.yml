name: A TuBe 8-Hour Auto Harvester & Catalog Sync

on:
  schedule:
    # Runs every 8 hours at minute 0 (00:00, 08:00, 16:00 UTC)
    - cron: '0 */8 * * *'
  workflow_dispatch:
    inputs:
      max_pages:
        description: 'Number of pages per category to crawl'
        required: false
        default: '2'
      providers:
        description: 'Target providers (space separated, or empty for all 10 portals)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  harvest-and-sync:
    name: Cloud Scraping & Catalog Enrichment
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: 📥 Check out repository code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🐍 Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 Install dependencies & Playwright Chromium
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install playwright requests beautifulsoup4 aiohttp
          python -m playwright install --with-deps chromium

      - name: 🚀 Run Autonomous Multi-Portal Harvester
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY || 'cabefb963ee5db1ecd2c5778bda9b6d0' }}
          PROJECT_ROOT: ${{ github.workspace }}
        run: |
          PAGES="${{ github.event.inputs.max_pages || '2' }}"
          PROVIDERS="${{ github.event.inputs.providers || '' }}"
          
          if [ -z "$PROVIDERS" ]; then
            python tools/cloud_scraper.py --pages "$PAGES"
          else
            python tools/cloud_scraper.py --pages "$PAGES" --providers $PROVIDERS
          fi

      - name: 💾 Commit and Push Updated Catalog to GitHub
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git add config/atube_data.sqlite data/ docs/active_url.json 2>/dev/null || true
          
          if git diff --staged --quiet; then
            echo "No new media updates in this 8-hour harvest cycle."
          else
            git commit -m "chore(harvester): automated 8-hour multi-portal sync [skip ci]"
            git push
            echo "Successfully pushed updated database & catalog to GitHub repository."
          fi

      - name: 📊 Upload Harvest Summary & Catalog Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: atube-cloud-harvest-summary
          path: |
            data/cloud_harvest_summary.json
            data/cloud_harvest_export.json
            config/atube_data.sqlite
          retention-days: 7
